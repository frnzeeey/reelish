name: Android APK release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          clean: true

      - name: Verify checked out commit
        run: |
          set -euo pipefail
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match the commit referenced by this tag."
            echo "Expected: $GITHUB_SHA"
            echo "Checked out: $CHECKED_OUT_COMMIT"
            exit 1
          fi
          echo "Building tag $GITHUB_REF_NAME at commit $CHECKED_OUT_COMMIT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Derive app version and Android build number
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH without leading zeroes."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD_NUMBER="$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))"
          if (( BUILD_NUMBER < 1 || BUILD_NUMBER > 2100000000 )); then
            echo "Tag $RELEASE_TAG produces an Android version code outside 1-2100000000."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION with Android version code $BUILD_NUMBER"

      - name: Validate signing secrets and restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ONFEED_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: ONFEED_${name}"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/onfeed-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "The restored release keystore is empty."
            exit 1
          fi
          echo "ONFEED_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build and verify signed APK
        env:
          ONFEED_RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          ONFEED_RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          ONFEED_RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "Flutter did not produce a non-empty release APK at $APK_PATH."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android SDK build-tools did not provide apksigner."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Stage and checksum freshly built APK
        run: |
          set -euo pipefail
          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"
          STAGED_APK="release/reelish.apk"

          if [[ ! -s "$SOURCE_APK" ]]; then
            echo "Fresh Flutter APK is missing or empty: $SOURCE_APK"
            exit 1
          fi

          mkdir -p release
          rm -f release/reelish.apk release/reelish.apk.sha256
          cp -- "$SOURCE_APK" "$STAGED_APK"
          if [[ ! -s "$STAGED_APK" ]] || ! cmp -s -- "$SOURCE_APK" "$STAGED_APK"; then
            echo "Staged APK is missing, empty, or differs from the fresh Flutter output."
            exit 1
          fi

          (
            cd release
            sha256sum reelish.apk > reelish.apk.sha256
            sha256sum --check reelish.apk.sha256
          )
          cat release/reelish.apk.sha256

      - name: Create draft release with staged APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release/reelish.apk \
            release/reelish.apk.sha256 \
            --verify-tag \
            --title "Reelish $GITHUB_REF_NAME" \
            --generate-notes \
            --draft

          gh release view "$GITHUB_REF_NAME" --json assets --jq \
            '.assets | (any(.name == "reelish.apk" and .size > 0) and any(.name == "reelish.apk.sha256" and .size > 0))' \
            | grep -qx true

          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/onfeed-release.jks"
