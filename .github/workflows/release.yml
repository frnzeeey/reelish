name: Android APK release

# The only way a Reelish APK reaches a GitHub Release. Pushing a vX.Y.Z tag
# builds that exact commit on a fresh runner, proves the APK came from it,
# and publishes the release. Never upload APKs to releases by hand.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned so a tag always rebuilds with the same toolchain. Keep in step with
  # the Flutter version used locally (`flutter --version`).
  FLUTTER_VERSION: '3.44.8'
  APK_PATH: build/app/outputs/flutter-apk/app-release.apk

jobs:
  release:
    name: Build and publish tagged APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          clean: true

      - name: Verify tag, commit, branch, and version
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "event sha:  $GITHUB_SHA"
          echo "checkout:   $HEAD_SHA"
          echo "tag commit: $TAG_SHA"
          echo "source tree: $(git rev-parse 'HEAD^{tree}')"
          git log -1 --format='commit: %H%nauthor date: %ci%nsubject: %s'
          git describe --tags --exact-match HEAD

          if [[ "$HEAD_SHA" != "$GITHUB_SHA" || "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout, tag, and triggering event name different commits."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Checked-out source tree is not clean."
            exit 1
          fi

          # Releases come from main. Tagging another branch (or tagging before
          # pushing main) is how an older source was released in the past.
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::$RELEASE_TAG ($HEAD_SHA) is not on origin/main. Push main, then tag a main commit."
            exit 1
          fi
          echo "origin/main: $(git rev-parse origin/main)"
          if [[ "$HEAD_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "::warning::$RELEASE_TAG is not the tip of main; newer main commits are not in this release."
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH without leading zeroes."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD_NUMBER="$((MAJOR * 1000000 + MINOR * 1000 + PATCH))"
          if (( BUILD_NUMBER < 1 || BUILD_NUMBER > 2100000000 )); then
            echo "::error::$RELEASE_TAG gives Android version code $BUILD_NUMBER, outside 1-2100000000."
            exit 1
          fi

          # A new release must be the highest version; reusing or going below
          # an existing version would ship an APK Android cannot update to.
          HIGHEST_OTHER="$(git tag -l 'v*.*.*' | grep -Ev "^${RELEASE_TAG}\$" | sort -V | tail -n 1 || true)"
          if [[ -n "$HIGHEST_OTHER" ]] && \
             [[ "$(printf '%s\n%s\n' "$HIGHEST_OTHER" "$RELEASE_TAG" | sort -V | tail -n 1)" != "$RELEASE_TAG" ]]; then
            echo "::error::$RELEASE_TAG is not newer than existing tag $HIGHEST_OTHER."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A GitHub Release for $RELEASE_TAG already exists. Inspect and delete it before rebuilding, or release a new version."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Building $RELEASE_TAG: versionName $VERSION, versionCode $BUILD_NUMBER"

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ONFEED_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ONFEED_${name}"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/onfeed-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::ONFEED_RELEASE_KEYSTORE_BASE64 decoded to an empty keystore."
            exit 1
          fi
          echo "ONFEED_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Build release APK
        id: build
        env:
          ONFEED_RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          ONFEED_RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          ONFEED_RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.source.outputs.version }}
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter --version

          # The runner is fresh and nothing is restored from a cache, so no
          # APK can exist yet. Prove it rather than assume it.
          if [[ -n "$(find . -type f -iname '*.apk' -not -path './.git/*' -print -quit)" ]]; then
            echo "::error::APK files exist before the build; refusing to continue."
            find . -type f -iname '*.apk' -not -path './.git/*'
            exit 1
          fi

          flutter pub get
          BUILD_STARTED_EPOCH="$(date -u +%s)"
          echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define="REELISH_GIT_SHA=$GITHUB_SHA" \
            --dart-define="REELISH_BUILD_TAG=$RELEASE_TAG"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Flutter did not produce $APK_PATH."
            exit 1
          fi
          if (( $(stat -c %Y "$APK_PATH") < BUILD_STARTED_EPOCH )); then
            echo "::error::$APK_PATH predates this build."
            exit 1
          fi

      - name: Verify APK identity
        id: verify
        env:
          VERSION: ${{ steps.source.outputs.version }}
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [[ ! -x "$AAPT2" || ! -x "$APKSIGNER" ]]; then
            echo "::error::aapt2/apksigner not found in $BUILD_TOOLS; cannot verify the APK."
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          PACKAGE_LINE="$(grep -m1 '^package:' <<< "$BADGING")"
          echo "$PACKAGE_LINE"
          APP_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$PACKAGE_LINE")"
          APK_VERSION_CODE="$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<< "$PACKAGE_LINE")"
          APK_VERSION_NAME="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$PACKAGE_LINE")"
          EXPECTED_APP_ID="$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          if [[ -z "$EXPECTED_APP_ID" || "$APP_ID" != "$EXPECTED_APP_ID" ]]; then
            echo "::error::APK application ID '$APP_ID' does not match build.gradle.kts '$EXPECTED_APP_ID'."
            exit 1
          fi
          if [[ "$APK_VERSION_NAME" != "$VERSION" || "$APK_VERSION_CODE" != "$BUILD_NUMBER" ]]; then
            echo "::error::APK is $APK_VERSION_NAME ($APK_VERSION_CODE); expected $VERSION ($BUILD_NUMBER)."
            exit 1
          fi

          # The commit SHA is compiled into the Dart AOT snapshot; finding it
          # proves the APK was compiled from this checkout.
          LIBAPP="$RUNNER_TEMP/libapp.so"
          unzip -p "$APK_PATH" lib/arm64-v8a/libapp.so > "$LIBAPP"
          if ! grep -qaF "$GITHUB_SHA" "$LIBAPP"; then
            echo "::error::APK does not embed commit $GITHUB_SHA."
            exit 1
          fi
          rm -f "$LIBAPP"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          {
            echo "app_id=$APP_ID"
            echo "size=$(stat -c %s "$APK_PATH")"
            echo "sha256=$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.source.outputs.version }}
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          APP_ID: ${{ steps.verify.outputs.app_id }}
          APK_SIZE: ${{ steps.verify.outputs.size }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          BUILD_STARTED_UTC: ${{ steps.build.outputs.started_utc }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          cp -- "$APK_PATH" release/reelish.apk
          if [[ "$(sha256sum release/reelish.apk | cut -d ' ' -f 1)" != "$APK_SHA256" ]]; then
            echo "::error::Staged APK differs from the verified build output."
            exit 1
          fi
          printf '%s  reelish.apk\n' "$APK_SHA256" > release/reelish.apk.sha256

          {
            echo "Reelish release build"
            echo
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $GITHUB_SHA"
            echo "Commit subject: $(git log -1 --format=%s)"
            echo "Commit date: $(git log -1 --format=%cI)"
            echo "Source tree: $(git rev-parse 'HEAD^{tree}')"
            echo "Application ID: $APP_ID"
            echo "Version name: $VERSION"
            echo "Version code: $BUILD_NUMBER"
            echo "APK SHA-256: $APK_SHA256"
            echo "APK size bytes: $APK_SIZE"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo "Build started UTC: $BUILD_STARTED_UTC"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
          } > release/build-info.txt
          cat release/build-info.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          # Upload as a draft first, so users and the in-app updater never see
          # a release until its APK is proven to be the one built here.
          gh release create "$RELEASE_TAG" \
            release/reelish.apk \
            release/reelish.apk.sha256 \
            release/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Reelish $RELEASE_TAG" \
            --generate-notes \
            --draft

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern reelish.apk --dir "$RUNNER_TEMP/uploaded"
          UPLOADED_SHA256="$(sha256sum "$RUNNER_TEMP/uploaded/reelish.apk" | cut -d ' ' -f 1)"
          if [[ "$UPLOADED_SHA256" != "$APK_SHA256" ]]; then
            echo "::error::Uploaded reelish.apk ($UPLOADED_SHA256) is not the verified build ($APK_SHA256). Draft left unpublished."
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $RELEASE_TAG with reelish.apk sha256 $APK_SHA256"

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/onfeed-release.jks"
