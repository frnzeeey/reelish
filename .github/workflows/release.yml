name: Android APK release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          clean: true

      - name: Prove checkout and identify source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "github.ref=$GITHUB_REF"
          echo "github.ref_name=$GITHUB_REF_NAME"
          echo "github.sha=$GITHUB_SHA"
          echo "github.repository=$GITHUB_REPOSITORY"
          echo "github.workflow=$GITHUB_WORKFLOW"
          echo "github.run_id=$GITHUB_RUN_ID"
          echo "github.run_number=$GITHUB_RUN_NUMBER"
          echo "github.event_name=$GITHUB_EVENT_NAME"

          echo "--- git status ---"
          git status --short --branch
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The checked out source tree is not clean."
            exit 1
          fi
          echo "git branch --show-current: $(git branch --show-current)"
          echo "git rev-parse HEAD: $(git rev-parse HEAD)"
          git log -1 --format='git log -1: %H %ci %s'
          git remote -v

          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$CHECKED_OUT_COMMIT" != "$GITHUB_SHA" || "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Tag, checkout, and GitHub event do not identify the same commit."
            echo "checkout=$CHECKED_OUT_COMMIT tag=$TAG_COMMIT event=$GITHUB_SHA"
            exit 1
          fi

          echo "--- source file SHA-256 ---"
          sha256sum \
            lib/main.dart \
            lib/src/screens/app_information_screens.dart \
            lib/src/screens/home_screen.dart \
            lib/src/widgets/liquid_glass.dart \
            lib/src/widgets/media_card.dart \
            lib/src/widgets/soft_glass_dock.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Record Flutter version
        id: flutter
        run: |
          set -euo pipefail
          flutter --version > "$RUNNER_TEMP/flutter-version.txt"
          cat "$RUNNER_TEMP/flutter-version.txt"
          echo "version=$(head -n 1 "$RUNNER_TEMP/flutter-version.txt")" >> "$GITHUB_OUTPUT"

      - name: Derive app version and Android build number
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH without leading zeroes."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD_NUMBER="$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))"
          if (( BUILD_NUMBER < 1 || BUILD_NUMBER > 2100000000 )); then
            echo "Tag $RELEASE_TAG produces an Android version code outside 1-2100000000."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION with Android version code $BUILD_NUMBER"

      - name: Validate signing secrets and restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ONFEED_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: ONFEED_${name}"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/onfeed-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "The restored release keystore is empty."
            exit 1
          fi
          echo "ONFEED_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Remove old APKs and clean Flutter outputs
        run: |
          set -euo pipefail
          rm -f \
            build/app/outputs/flutter-apk/app-release.apk \
            release/reelish.apk \
            reelish.apk
          flutter clean

          echo "APK files present before build (must be empty):"
          mapfile -t APK_FILES < <(find . -type f -iname '*.apk' -not -path './.git/*' -print | sort)
          printf '%s\n' "${APK_FILES[@]}"
          if (( ${#APK_FILES[@]} != 0 )); then
            echo "Unexpected APK files remain after cleaning; refusing to build."
            exit 1
          fi

      - name: Resolve dependencies and build release APK
        id: build
        env:
          ONFEED_RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          ONFEED_RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          ONFEED_RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter pub get

          BUILD_STARTED_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_STARTED_EPOCH="$(date -u +%s)"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define="REELISH_GIT_SHA=$GITHUB_SHA" \
            --dart-define="REELISH_BUILD_TAG=$RELEASE_TAG" \
            --dart-define="REELISH_BUILD_NUMBER=$BUILD_NUMBER"

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "Flutter did not produce a non-empty release APK at $APK_PATH."
            exit 1
          fi

          APK_SIZE="$(stat -c %s "$APK_PATH")"
          APK_MTIME_EPOCH="$(stat -c %Y "$APK_PATH")"
          APK_MTIME_UTC="$(stat -c %y "$APK_PATH")"
          if (( APK_SIZE <= 0 || APK_MTIME_EPOCH < BUILD_STARTED_EPOCH )); then
            echo "APK is empty or predates this workflow build."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android SDK build-tools did not provide apksigner."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          EXPECTED_APP_ID="$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          if [[ -z "$EXPECTED_APP_ID" ]]; then
            echo "Could not read the applicationId from android/app/build.gradle.kts."
            exit 1
          fi

          APK_APPLICATION_ID="unknown"
          APK_VERSION_NAME="$VERSION"
          APK_VERSION_CODE="$BUILD_NUMBER"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -n "$APKANALYZER" ]]; then
            APK_APPLICATION_ID="$("$APKANALYZER" manifest application-id "$APK_PATH")"
            APK_VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK_PATH")"
            APK_VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK_PATH")"
          else
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            if [[ -n "$AAPT" ]]; then
              BADGING="$("$AAPT" dump badging "$APK_PATH")"
              APK_APPLICATION_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
              APK_VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
              APK_VERSION_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
            fi
          fi

          echo "APK package=$APK_APPLICATION_ID versionName=$APK_VERSION_NAME versionCode=$APK_VERSION_CODE size=$APK_SIZE modified=$APK_MTIME_UTC"
          if [[ "$APK_APPLICATION_ID" != unknown && "$APK_APPLICATION_ID" != "$EXPECTED_APP_ID" ]]; then
            echo "APK application ID differs from android/app/build.gradle.kts."
            exit 1
          fi
          if [[ "$APK_VERSION_NAME" != "$VERSION" || "$APK_VERSION_CODE" != "$BUILD_NUMBER" ]]; then
            echo "APK version metadata differs from the release tag."
            exit 1
          fi

          echo "started_utc=$BUILD_STARTED_UTC" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_mtime_utc=$APK_MTIME_UTC" >> "$GITHUB_OUTPUT"
          echo "apk_application_id=$APK_APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Stage APK, prove checksum, and write build provenance
        env:
          FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILT_APK_SIZE: ${{ steps.build.outputs.apk_size }}
          BUILT_APK_MTIME_UTC: ${{ steps.build.outputs.apk_mtime_utc }}
          BUILD_STARTED_UTC: ${{ steps.build.outputs.started_utc }}
          APK_APPLICATION_ID: ${{ steps.build.outputs.apk_application_id }}
          BUILT_APK_SHA256: ${{ steps.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"
          STAGED_APK="release/reelish.apk"

          if [[ ! -s "$SOURCE_APK" ]]; then
            echo "Fresh Flutter APK is missing or empty: $SOURCE_APK"
            exit 1
          fi

          mkdir -p release
          rm -f release/reelish.apk release/reelish.apk.sha256 release/build-info.txt
          cp -- "$SOURCE_APK" "$STAGED_APK"
          if [[ ! -s "$STAGED_APK" ]] || ! cmp -s -- "$SOURCE_APK" "$STAGED_APK"; then
            echo "Staged APK is missing, empty, or differs from the fresh Flutter output."
            exit 1
          fi

          SOURCE_SHA256="$(sha256sum "$SOURCE_APK" | cut -d ' ' -f 1)"
          STAGED_SHA256="$(sha256sum "$STAGED_APK" | cut -d ' ' -f 1)"
          if [[ "$SOURCE_SHA256" != "$STAGED_SHA256" || "$SOURCE_SHA256" != "$BUILT_APK_SHA256" ]]; then
            echo "Canonical APK, staged APK, and build-step checksums do not match."
            exit 1
          fi
          printf '%s  reelish.apk\n' "$STAGED_SHA256" > release/reelish.apk.sha256
          (cd release && sha256sum --check reelish.apk.sha256)

          mapfile -t APK_FILES < <(find . -type f -iname '*.apk' -not -path './.git/*' -print | sort)
          printf 'APK files before release upload:\n%s\n' "${APK_FILES[@]}"
          if (( ${#APK_FILES[@]} != 2 )) || \
             [[ "${APK_FILES[0]}" != "./build/app/outputs/flutter-apk/app-release.apk" ]] || \
             [[ "${APK_FILES[1]}" != "./release/reelish.apk" ]]; then
            echo "Unexpected APK inventory; refusing to publish."
            exit 1
          fi

          COMMIT_MESSAGE="$(git log -1 --format=%s)"
          COMMIT_BRANCH="$(git branch --show-current)"
          [[ -n "$COMMIT_BRANCH" ]] || COMMIT_BRANCH="detached tag checkout"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'Reelish Release Build\n\nTag: %s\nCommit SHA: %s\nCommit message: %s\nChecked out branch: %s\nGitHub repository: %s\nGitHub workflow: %s\nGitHub run ID: %s\nGitHub run number: %s\nGitHub event: %s\nFlutter version: %s\nAPK SHA-256: %s\nAPK size bytes: %s\nAPK modified UTC: %s\nBuild started UTC: %s\nBuild timestamp UTC: %s\nVersion name: %s\nVersion code: %s\nApplication ID: %s\n' \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$COMMIT_MESSAGE" \
            "$COMMIT_BRANCH" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKFLOW" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_NUMBER" \
            "$GITHUB_EVENT_NAME" \
            "$FLUTTER_VERSION" \
            "$STAGED_SHA256" \
            "$BUILT_APK_SIZE" \
            "$BUILT_APK_MTIME_UTC" \
            "$BUILD_STARTED_UTC" \
            "$BUILD_TIMESTAMP" \
            "$RELEASE_VERSION" \
            "$RELEASE_BUILD_NUMBER" \
            "$APK_APPLICATION_ID" > release/build-info.txt
          cat release/reelish.apk.sha256
          cat release/build-info.txt

      - name: Create draft release and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release/reelish.apk \
            release/reelish.apk.sha256 \
            release/build-info.txt \
            --verify-tag \
            --title "Reelish $GITHUB_REF_NAME" \
            --generate-notes \
            --draft

          gh release view "$GITHUB_REF_NAME" --json assets --jq \
            '.assets | (any(.name == "reelish.apk" and .size > 0) and any(.name == "reelish.apk.sha256" and .size > 0) and any(.name == "build-info.txt" and .size > 0))' \
            | grep -qx true

          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/onfeed-release.jks"
