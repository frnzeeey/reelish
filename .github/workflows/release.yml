name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ONFEED_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: ONFEED_$name"
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ONFEED_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onfeed-release.jks"

      - name: Build signed universal APK
        env:
          ONFEED_RELEASE_STORE_FILE: ${{ runner.temp }}/onfeed-release.jks
          ONFEED_RELEASE_STORE_PASSWORD: ${{ secrets.ONFEED_RELEASE_STORE_PASSWORD }}
          ONFEED_RELEASE_KEY_ALIAS: ${{ secrets.ONFEED_RELEASE_KEY_ALIAS }}
          ONFEED_RELEASE_KEY_PASSWORD: ${{ secrets.ONFEED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH (for example v1.0.5)."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( 10#$MINOR >= 1000 || 10#$PATCH >= 1000 )); then
            echo "Release minor and patch numbers must be below 1000."
            exit 1
          fi
          BUILD_NUMBER="$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))"
          if (( BUILD_NUMBER < 1 || BUILD_NUMBER > 2100000000 )); then
            echo "Release tag produces an Android version code outside the supported range (1-2100000000)."
            exit 1
          fi
          flutter pub get
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/reelish.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android SDK build-tools did not provide apksigner."
            exit 1
          fi
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/reelish.apk

      - name: Publish APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/reelish.apk "$RUNNER_TEMP/reelish.apk"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if jq -e '.isDraft == true or .isPrerelease == true' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "Refusing to publish the app APK to a draft or prerelease."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/reelish.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/reelish.apk" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | any(.name == "reelish.apk" and .size > 0)' | grep -qx true; then
            echo "The GitHub release is missing a non-empty reelish.apk asset."
            exit 1
          fi
