name: Release (Windows)

# Builds the Windows app and attaches it to the GitHub Release that
# release.yml publishes for the same vMAJOR.MINOR.PATCH tag. This workflow
# never creates, edits or replaces a release or the APK: it only adds
# Reelish-Windows-x64.zip (portable), Reelish-Setup-x64.exe (the per-user
# installer the in-app updater uses) and their .sha256 files, so a failed
# Windows build can never block or alter an Android release. Run it manually (workflow_dispatch) to
# build and verify the ZIP as a workflow artifact without publishing, or with
# release_tag set to build that tag's exact commit and attach the ZIP to its
# existing release (for example after a failed Windows run).
# See docs/windows.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (vX.Y.Z) to build and attach to; empty builds the branch without publishing'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The release this run builds: the pushed tag, or the manual release_tag.
  TAG: ${{ inputs.release_tag || github.ref_name }}
  PUBLISH: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
  # Keep in step with release.yml and the local `flutter --version`.
  FLUTTER_VERSION: '3.44.8'
  ASSET_NAME: Reelish-Windows-x64.zip
  # The per-user installer the in-app updater installs from
  # (windows/installer/reelish.iss). Keep in step with UpdateConfig.
  INSTALLER_NAME: Reelish-Setup-x64.exe
  RELEASE_DIR: build/windows/x64/runner/Release
  # SHA-256 of the QuickJS bridge committed in third_party (see
  # third_party/flutter_js/REELISH_PATCH.md). A different DLL fails the build.
  QUICKJS_BRIDGE_SHA256: e08ccf396e071894d18ba6c818cfe7cf2ec4f13ee87c4a1fd421a14e7a35fb69
  # SHA-256 of the torrent engine DLL committed in
  # packages/flutter_go_torrent_streamer/windows/shared (built by
  # go/build_windows.ps1, reproducible with Go 1.27.3 and llvm-mingw
  # 20261020 UCRT). Without a committed DLL, Windows builds ship without
  # torrent playback; a different DLL fails the build.
  TORRENT_STREAMER_SHA256: 372207fe7eca4a60a7f1c7b2c55843498ab7228dfd3d718e80aa55d45769e9de

jobs:
  build:
    name: Build Windows ${{ inputs.release_tag || github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual release_tag builds exactly that tag's commit.
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read and check the application version
        id: version
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' pubspec.yaml | tr -d '\r')"
          if [[ ! "$PUBSPEC_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml version '$PUBSPEC_VERSION' must be MAJOR.MINOR.PATCH+BUILD."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if [[ "$PUBLISH" == "true" && "v$VERSION" != "$TAG" ]]; then
            echo "::error::Release tag ($TAG) does not match pubspec.yaml version ($VERSION)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # File and artifact names: a manual run of a branch such as
          # feature/x has a '/' in TAG, which neither may contain.
          echo "ARTIFACT_TAG=${TAG//\//-}" >> "$GITHUB_ENV"
          echo "Building Reelish $VERSION for Windows from $(git rev-parse HEAD)"

      - name: Verify the QuickJS bridge
        shell: pwsh
        run: |
          $dll = 'third_party/flutter_js/windows/shared/quickjs_c_bridge.dll'
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:QUICKJS_BRIDGE_SHA256) {
            throw "quickjs_c_bridge.dll is $hash, expected $env:QUICKJS_BRIDGE_SHA256."
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $exports = & $dumpbin.FullName /nologo /exports $dll
          foreach ($symbol in 'JS_SetMemoryLimit', 'JS_SetInterruptHandler', 'jsNewRuntime', 'jsEval') {
            if (-not ($exports -match "\s$symbol$")) { throw "quickjs_c_bridge.dll does not export $symbol." }
          }
          Write-Host "quickjs_c_bridge.dll verified: $hash"

      - name: Verify the torrent engine
        shell: pwsh
        run: |
          $dll = 'packages/flutter_go_torrent_streamer/windows/shared/torrent_streamer.dll'
          if (-not (Test-Path $dll)) {
            Write-Host 'No torrent engine DLL committed: this build has no torrent playback.'
            exit 0
          }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TORRENT_STREAMER_SHA256) {
            throw "torrent_streamer.dll is $hash, expected '$env:TORRENT_STREAMER_SHA256'."
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $exports = & $dumpbin.FullName /nologo /exports $dll
          foreach ($symbol in 'Init', 'StartStream', 'GetFiles', 'SelectFile', 'StopClient', 'FreeString') {
            if (-not ($exports -match "\s$symbol$")) { throw "torrent_streamer.dll does not export $symbol." }
          }
          Write-Host "torrent_streamer.dll verified: $hash"

      - name: Check secrets and the API address
        env:
          # The app's Reelish API address: a repository variable, not a secret.
          REELISH_API_URL: ${{ vars.REELISH_API_URL }}
          SYMBOLS_PASSPHRASE: ${{ secrets.ONFEED_SYMBOLS_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$SYMBOLS_PASSPHRASE" ]]; then
            echo "::error::Missing GitHub Actions secret for SYMBOLS_PASSPHRASE (see docs/releasing.md)."
            exit 1
          fi
          # The app reaches TMDB through the Reelish API and carries no TMDB
          # key; it only needs the API's address.
          if [[ ! "$REELISH_API_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._/-]*)?$ ]]; then
            echo "::error::Repository variable REELISH_API_URL must be an https:// address (see docs/backend/operations.md)."
            exit 1
          fi
          echo "REELISH_API_URL=$REELISH_API_URL" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Windows tests
        # The sandbox limits and engine selection that only Windows exercises.
        run: >-
          flutter test
          test/quickjs_windows_limits_test.dart
          test/provider_runner_test.dart
          test/playback_pipeline_test.dart
          test/github_update_check_test.dart
          test/windows_update_test.dart

      - name: Build
        run: |
          set -euo pipefail
          SYMBOLS_DIR="$RUNNER_TEMP/symbols/$ARTIFACT_TAG"
          echo "SYMBOLS_DIR=$SYMBOLS_DIR" >> "$GITHUB_ENV"
          flutter build windows --release \
            --obfuscate --split-debug-info="$SYMBOLS_DIR" \
            --dart-define="REELISH_GIT_SHA=$GITHUB_SHA" \
            --dart-define="REELISH_BUILD_TAG=$TAG" \
            --dart-define="REELISH_API_URL=$REELISH_API_URL"

      - name: Verify the build
        shell: pwsh
        run: |
          $dir = $env:RELEASE_DIR
          $required = 'Reelish.exe', 'flutter_windows.dll', 'libmpv-2.dll',
            'quickjs_c_bridge.dll', 'flutter_js_plugin.dll',
            'media_kit_video_plugin.dll', 'url_launcher_windows_plugin.dll',
            'data/app.so', 'data/icudtl.dat', 'data/flutter_assets/AssetManifest.bin'
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Missing $file in the build output." }
          }
          $version = (Get-Item (Join-Path $dir 'Reelish.exe')).VersionInfo
          if ($version.ProductName -ne 'Reelish' -or $version.CompanyName -ne 'frnzeeey') {
            throw "Unexpected Reelish.exe identity: $($version.ProductName) / $($version.CompanyName)."
          }
          if (-not $version.ProductVersion.StartsWith('${{ steps.version.outputs.version }}')) {
            throw "Reelish.exe version $($version.ProductVersion) is not ${{ steps.version.outputs.version }}."
          }
          $bridge = (Get-FileHash (Join-Path $dir 'quickjs_c_bridge.dll') -Algorithm SHA256).Hash.ToLower()
          if ($bridge -ne $env:QUICKJS_BRIDGE_SHA256) { throw 'The bundled QuickJS bridge is not the verified one.' }
          if (Test-Path 'packages/flutter_go_torrent_streamer/windows/shared/torrent_streamer.dll') {
            $engine = Join-Path $dir 'torrent_streamer.dll'
            if (-not (Test-Path $engine)) { throw 'The torrent engine DLL was not bundled.' }
            if ((Get-FileHash $engine -Algorithm SHA256).Hash.ToLower() -ne $env:TORRENT_STREAMER_SHA256) {
              throw 'The bundled torrent engine is not the verified one.'
            }
          }
          # Obfuscated Dart code must not carry Reelish's class names.
          $app = [System.IO.File]::ReadAllText((Join-Path $dir 'data/app.so'), [System.Text.Encoding]::GetEncoding(28591))
          foreach ($name in 'ProviderFetchBridge', 'TmdbService', 'package:onfeed/src') {
            if ($app.Contains($name)) { throw "app.so is not obfuscated ($name found)." }
          }
          foreach ($name in 'OnfeedFetch', 'getStreams', 'reelish/window') {
            if (-not $app.Contains($name)) { throw "app.so lost the required string $name." }
          }
          Write-Host "Reelish.exe $($version.ProductVersion) verified."

      - name: Package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'package/Reelish'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse -Path "$env:RELEASE_DIR/*" -Destination $stage
          $zip = Join-Path $env:RUNNER_TEMP $env:ASSET_NAME
          # Windows' bsdtar writes standard '/' entry paths (Compress-Archive
          # and .NET Framework's ZipFile write '\'), with a top-level Reelish
          # folder.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip -C (Split-Path $stage) Reelish
          if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)." }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET_NAME" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $zip, "$zip.sha256" dist/
          Write-Host "$env:ASSET_NAME $((Get-Item dist/$env:ASSET_NAME).Length) bytes, SHA-256 $hash"

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          function Find-Iscc {
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed ($LASTEXITCODE)." }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'ISCC.exe was not found.' }
          Write-Host "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion)"
          $out = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$((Resolve-Path $env:RELEASE_DIR).Path)" "/DOutputDir=$out" windows/installer/reelish.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)." }
          $setup = Join-Path $out $env:INSTALLER_NAME
          if (-not (Test-Path $setup)) { throw "$env:INSTALLER_NAME was not generated." }
          # The in-app updater refuses an installer that does not identify as
          # Reelish by frnzeeey at exactly the release version.
          # Inno Setup pads these strings with spaces.
          $info = (Get-Item $setup).VersionInfo
          if ($info.ProductName.Trim() -ne 'Reelish' -or $info.CompanyName.Trim() -ne 'frnzeeey') {
            throw "Unexpected installer identity: $($info.ProductName) / $($info.CompanyName)."
          }
          $v = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart)"
          if ($v -ne $env:VERSION) { throw "Installer version $v is not $env:VERSION." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:INSTALLER_NAME" | Out-File -Encoding ascii -NoNewline "$setup.sha256"
          Move-Item $setup, "$setup.sha256" dist/
          Write-Host "$env:INSTALLER_NAME $((Get-Item dist/$env:INSTALLER_NAME).Length) bytes, SHA-256 $hash"

      - name: Test the installer
        # A real per-user install and uninstall on the runner, without
        # administrator rights, with the arguments the in-app updater uses
        # (except /RELAUNCH, so nothing is opened).
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'install-test\Reelish'
          $log = Join-Path $env:RUNNER_TEMP 'install-test.log'
          $setup = Resolve-Path "dist/$env:INSTALLER_NAME"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', "/DIR=`"$dir`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Setup exited with $($p.ExitCode)." }
          foreach ($file in 'Reelish.exe', 'unins000.exe', 'unins000.dat', 'data/app.so', 'libmpv-2.dll') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "The installation has no $file." }
          }
          $built = (Get-FileHash (Join-Path $env:RELEASE_DIR 'Reelish.exe')).Hash
          if ((Get-FileHash (Join-Path $dir 'Reelish.exe')).Hash -ne $built) { throw 'The installed Reelish.exe is not the built one.' }
          # An update over that installation, with Setup's current directory
          # in the app folder (as when Reelish 1.15.0 or earlier, started from
          # its Start menu shortcut, starts it). A file only an older version
          # had must be gone afterwards, and no backup left behind.
          Set-Content (Join-Path $dir 'only-in-an-older-version.txt') 'old'
          $p = Start-Process $setup -Wait -PassThru -WorkingDirectory $dir -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', "/DIR=`"$dir`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "The update exited with $($p.ExitCode)." }
          if ((Get-FileHash (Join-Path $dir 'Reelish.exe')).Hash -ne $built) { throw 'The updated Reelish.exe is not the built one.' }
          if (Test-Path (Join-Path $dir 'only-in-an-older-version.txt')) { throw 'The update left a file of the older version.' }
          if (Test-Path "$dir.previous") { throw 'The update left its backup behind.' }
          $p = Start-Process (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "Uninstall exited with $($p.ExitCode)." }
          # The uninstaller removes itself shortly after it exits.
          for ($i = 0; $i -lt 20 -and (Test-Path (Join-Path $dir 'Reelish.exe')); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Join-Path $dir 'Reelish.exe')) { throw 'Uninstall left Reelish.exe behind.' }
          Write-Host 'Installer installed, updated and uninstalled cleanly.'

      - name: Package encrypted debug symbols
        env:
          SYMBOLS_PASSPHRASE: ${{ secrets.ONFEED_SYMBOLS_PASSPHRASE }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/symbols-package"
          mkdir -p "$OUT"
          # --force-local: Git Bash's tar would read the "D:" in a Windows path
          # as a remote host.
          tar --force-local -czf "$OUT/symbols.tar.gz" -C "$SYMBOLS_DIR" .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$OUT/symbols.tar.gz" -out "dist/reelish-windows-${ARTIFACT_TAG}-symbols.tar.gz.enc" \
            -pass env:SYMBOLS_PASSPHRASE
          rm -rf "$OUT" "$SYMBOLS_DIR"

      - name: Upload the ZIP (workflow artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reelish-windows-${{ env.ARTIFACT_TAG }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
            dist/${{ env.INSTALLER_NAME }}
            dist/${{ env.INSTALLER_NAME }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload encrypted debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reelish-windows-${{ env.ARTIFACT_TAG }}-symbols
          path: dist/reelish-windows-${{ env.ARTIFACT_TAG }}-symbols.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Attach to release ${{ inputs.release_tag || github.ref_name }}
    needs: build
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Download the ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reelish-windows-${{ env.TAG }}
          path: dist

      - name: Wait for the Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release.yml creates the release once its APK is verified. Wait for
          # it rather than creating one: an Android failure means no release,
          # and this job then fails without publishing anything.
          for attempt in $(seq 1 80); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
              echo "Release $TAG exists."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Release $TAG was not published by release.yml within 40 minutes."
          exit 1

      - name: Attach the Windows ZIP and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "$ASSET_NAME.sha256"
          sha256sum -c "$INSTALLER_NAME.sha256"
          # --clobber replaces only these Windows assets on a re-run; the APK
          # and every other asset are left as they are.
          gh release upload "$TAG" "$ASSET_NAME" "$ASSET_NAME.sha256" \
            "$INSTALLER_NAME.sha256" "$INSTALLER_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber
